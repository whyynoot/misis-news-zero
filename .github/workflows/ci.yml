name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: news_analyzer_test
          POSTGRES_USER: news_analyzer
          POSTGRES_PASSWORD: news_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news_analyzer -d news_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment variables
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "DATABASE_ENGINE=postgresql" >> $GITHUB_ENV
        echo "POSTGRES_DB=news_analyzer_test" >> $GITHUB_ENV
        echo "POSTGRES_USER=news_analyzer" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=news_analyzer" >> $GITHUB_ENV
        echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
        echo "POSTGRES_PORT=5432" >> $GITHUB_ENV

    - name: Run tests
      run: |
        export DJANGO_SETTINGS_MODULE=news_analyzer.settings
        pytest analyzer/tests.py --cov=analyzer --cov-report=xml --cov-report=term-missing -v
